[package]
name = "obs-gamepad"
version = "0.1.2"
edition = "2024"

[lib]
name = "gamepad"
crate-type = ["cdylib"]

[dependencies]
obs-wrapper = "0.4"
tiny-skia = "0.11"
gilrs-core = "0.6"
minifb = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
notify-debouncer-mini = "0.7"
log = "0.4"
env_logger = "0.11"
serialport = { git = "https://github.com/erkki-silvola/serialport-rs", branch = "windows-overlapped-io" }
color-eyre = "0.6"
tiny_http = "0.12"

[profile.release]
lto = "thin"
panic = "abort"

# Optimize dependencies even in debug builds. The hot path in `--web` mode is
# PNG compression (in the `png`/`miniz_oxide` deps) and tiny-skia rendering;
# unoptimized those cost ~25ms/frame and can't keep up at 60fps, making the
# overlay laggy. Optimizing deps keeps `cargo run` real-time while still leaving
# our own crate unoptimized/debuggable.
[profile.dev.package."*"]
opt-level = 3
